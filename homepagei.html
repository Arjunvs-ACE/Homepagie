<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nook – make your own browser homepage</title>
<meta name="description" content="Design your own browser homepage, preview it live, and get a link to paste into your browser.">
<meta property="og:title" content="Nook – make your own browser homepage">
<meta property="og:description" content="Pick a theme, wallpaper and widgets, then paste one link into your browser.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-G78Bx/DNarkBIqnX+vgMOjWkrNgtmXDSshPGEF+aca0='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https: blob: data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏠%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Pacifico&family=Outfit:wght@300;500&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body,#app{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:#14131a;color:#ece9f5}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid #9b8cff;outline-offset:2px}

/* ---------- Homepage (viewer + preview) ---------- */
.hp{position:relative;width:100%;height:100%;min-height:100%;overflow:auto;color:var(--fg);font-family:var(--font);display:flex}
.hp .wp,.hp .dim{position:absolute;inset:0;background-size:cover;background-position:center}
.hp .wp{background:var(--bg);filter:blur(var(--blur));transform:scale(1.05)}
.hp .dim{background:#000;opacity:var(--dim)}
.hp main{position:relative;width:100%;max-width:640px;margin:auto;padding:clamp(20px,6vh,56px) 20px;display:flex;flex-direction:column;gap:18px;align-items:var(--al);text-align:var(--ta)}
.hp .w{background:var(--card);border:1px solid transparent;border-radius:var(--r);padding:14px 16px;width:100%}
.hp.glass .w{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:rgba(255,255,255,.18)}
.hp.solid .w{background:var(--solid);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.hp.outline .w{background:transparent;border:1.5px solid currentColor}
.hp.flat .w{background:transparent;padding-left:0;padding-right:0}
.hp .clock{font-size:clamp(56px,16vw,96px);line-height:1;font-weight:500;letter-spacing:-.02em}
.hp .date{opacity:.8;margin-top:6px}
.hp .hello{font-size:clamp(20px,5vw,28px)}
.hp .sx{display:flex;gap:8px}
.hp .sx input{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:6px 4px;font-size:17px}
.hp .sx input::placeholder{color:inherit;opacity:.55}
.hp .sx button{background:var(--ac);color:var(--acfg);border:0;border-radius:calc(var(--r) * .7);padding:8px 14px;cursor:pointer;font-weight:600}
.hp .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;width:100%}
.hp .tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;color:inherit;text-decoration:none;font-size:13px;overflow:hidden}
.hp .tile i{font-style:normal;width:42px;height:42px;border-radius:calc(var(--r) * .8);background:var(--ac);color:var(--acfg);display:grid;place-items:center;font-weight:600;font-size:18px;transition:transform .15s}
.hp .tile span{max-width:100%;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.hp .tile:hover i{transform:translateY(-2px)}
.hp textarea{width:100%;min-height:90px;resize:vertical;background:transparent;border:0;outline:0;font-size:15px;line-height:1.5}
.hp .lbl{font-size:13px;opacity:.7;margin-bottom:4px}
.hp .quote{font-size:15px;opacity:.9;font-style:italic}
.hp .tile small{font-size:11px;opacity:.75}
.hp.sh main{text-shadow:0 1px 10px rgba(0,0,0,.4)}
.hp.sh .sx button,.hp.sh .tile i{text-shadow:none}
.hp .banner{position:absolute;left:12px;right:12px;top:12px;z-index:3;background:#fff;color:#111;font:14px/1.4 Inter,system-ui,sans-serif;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.hp .banner button{border:0;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;background:#111;color:#fff}
.hp .edit{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2;color:inherit;opacity:.4;font-size:12px;text-decoration:none;padding:6px 10px;border-radius:99px;background:rgba(0,0,0,.2)}
.hp .edit:hover{opacity:1}

/* ---------- Builder ---------- */
#builder{display:grid;grid-template-columns:380px 1fr;height:100%}
#panel{overflow:auto;padding:22px 20px 120px;border-right:1px solid #2a2836;background:#191822}
#panel h1{font-family:'Playfair Display',serif;font-size:30px;margin-bottom:4px}
#panel .sub{color:#9c98b3;font-size:14px;margin-bottom:22px;line-height:1.45}
.sec{margin-bottom:22px}
.sec h2{font-size:15px;font-weight:600;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #34314a;background:#211f2e;border-radius:99px;padding:7px 13px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:#9b8cff;border-color:#9b8cff;color:#14131a;font-weight:600}
.sw{width:44px;height:44px;border-radius:12px;border:2px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed=true]{border-color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0;font-size:14px}
.row input[type=range]{flex:1;max-width:190px;accent-color:#9b8cff}
.row input[type=checkbox]{width:20px;height:20px;accent-color:#9b8cff}
.field,.ta{width:100%;background:#211f2e;border:1px solid #34314a;border-radius:10px;padding:10px 12px;margin-top:8px}
.ta{min-height:110px;resize:vertical;line-height:1.5}
.hint{font-size:12.5px;color:#9c98b3;margin-top:6px;line-height:1.4}
.err{color:#ff8a8a}
.val{font-style:normal;color:#9c98b3;margin-left:6px}
#stage{display:flex;flex-direction:column;min-width:0;min-height:0;padding:18px;gap:14px}
#frame{flex:1;min-height:0;border-radius:18px;overflow:hidden;border:1px solid #34314a;position:relative}
#frame .hp{position:absolute;inset:0;height:100%}
#bar{position:sticky;bottom:0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:600;cursor:pointer;background:#2a2740}
.btn.main{background:#9b8cff;color:#14131a;font-size:16px}
#out{display:none;background:#211f2e;border:1px solid #34314a;border-radius:14px;padding:14px;gap:10px;flex-direction:column}
#out.show{display:flex}
#out input{width:100%;background:#14131a;border:1px solid #34314a;border-radius:10px;padding:10px;font-size:13px}
#out ol{padding-left:18px;font-size:14px;line-height:1.7;color:#cfcbe6}
@media(max-width:820px){
  #builder{display:flex;flex-direction:column}
  #stage{order:-1;height:46vh;flex:none;padding:12px 12px 0}
  #bar{position:static}
  #panel{flex:1;border-right:0;padding-bottom:40px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* ========= Options ========= */
const THEMES={
  aesthetic:{n:"Aesthetic",bg:"linear-gradient(135deg,#fbc2eb,#a6c1ee)",fg:"#2d2a4a",card:"rgba(255,255,255,.35)",solid:"#fff7fb",ac:"#7c5cff",acfg:"#fff"},
  paper:{n:"Paper",bg:"#f3f3ef",fg:"#151515",card:"rgba(0,0,0,.05)",solid:"#ffffff",ac:"#151515",acfg:"#fff"},
  ink:{n:"Ink",bg:"#080808",fg:"#f5f5f5",card:"rgba(255,255,255,.07)",solid:"#171717",ac:"#f5f5f5",acfg:"#080808"},
  midnight:{n:"Midnight",bg:"radial-gradient(at 20% 10%,#1e3a8a,#0b1020 62%)",fg:"#e8ecff",card:"rgba(255,255,255,.08)",solid:"#141b36",ac:"#6ea8ff",acfg:"#0b1020"},
  sunset:{n:"Sunset",bg:"linear-gradient(135deg,#ff9a56,#ff5e7e 55%,#7b2ff7)",fg:"#fff",card:"rgba(255,255,255,.2)",solid:"#7b2ff7",ac:"#fff",acfg:"#7b2ff7"},
  forest:{n:"Forest",bg:"linear-gradient(160deg,#134e4a,#1a2e1f)",fg:"#e9f5ec",card:"rgba(255,255,255,.08)",solid:"#16322a",ac:"#6ee7a0",acfg:"#0f2a1c"}
};
const FONTS={sans:["Clean","Inter,system-ui,sans-serif"],serif:["Elegant","'Playfair Display',Georgia,serif"],mono:["Code","'JetBrains Mono',ui-monospace,monospace"],soft:["Soft","Outfit,system-ui,sans-serif"],script:["Playful","Pacifico,cursive"]};
const CARDS={glass:"Glass",solid:"Solid",outline:"Outline",flat:"Minimal"};
const ENGINES={brave:["Brave","https://search.brave.com/search?q="],google:["Google","https://www.google.com/search?q="],ddg:["DuckDuckGo","https://duckduckgo.com/?q="],bing:["Bing","https://www.bing.com/search?q="]};
const WIDGETS={greeting:"Greeting",clock:"Clock & date",search:"Search bar",links:"Quick links",notes:"Notes",quote:"Daily quote"};
const QUOTES=["Small steps, every day.","Make it work, then make it beautiful.","Done is better than perfect.","Focus on the next right thing.","You don’t have to see the whole staircase.","Curiosity is a superpower.","Slow is smooth, smooth is fast."];
const DEF={t:"aesthetic",f:"sans",cs:"glass",r:18,dim:0,blur:0,al:"center",h24:0,name:"",eng:"brave",
  w:{greeting:1,clock:1,search:1,links:1,notes:0,quote:0},
  wp:{m:"theme",u:""},
  links:"GitHub | github.com\nYouTube | youtube.com\nGmail | mail.google.com\nChatGPT | chatgpt.com\nReddit | reddit.com\nMaps | maps.google.com"};

/* ========= Safety helpers ========= */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(n,a,b,d)=>{n=Number(n);return isFinite(n)?Math.min(b,Math.max(a,n)):d};
function safeUrl(u){u=String(u||"").trim();if(!u)return"";try{const x=new URL(/^[a-z][a-z0-9+.-]*:/i.test(u)?u:"https://"+u);return/^https?:$/.test(x.protocol)?x.href:""}catch{return""}}
function clean(raw){ // validate any config coming from a URL or storage
  const c=JSON.parse(JSON.stringify(DEF));if(!raw||typeof raw!=="object")return c;
  if(raw.t in THEMES)c.t=raw.t;if(raw.f in FONTS)c.f=raw.f;if(raw.cs in CARDS)c.cs=raw.cs;if(raw.eng in ENGINES)c.eng=raw.eng;
  c.r=clamp(raw.r,0,32,c.r);c.dim=clamp(raw.dim,0,70,0);c.blur=clamp(raw.blur,0,20,0);
  c.al=raw.al==="left"?"left":"center";c.h24=raw.h24?1:0;c.name=String(raw.name||"").slice(0,30);
  if(raw.w&&typeof raw.w==="object")for(const k in WIDGETS)if(k in raw.w)c.w[k]=raw.w[k]?1:0;
  if(raw.wp&&typeof raw.wp==="object"){c.wp.m=["theme","url","up"].includes(raw.wp.m)?raw.wp.m:"theme";c.wp.u=safeUrl(raw.wp.u)}
  if(typeof raw.links==="string")c.links=raw.links.slice(0,2000);
  return c;
}
const slim=c=>{const o={};for(const k in c)if(JSON.stringify(c[k])!==JSON.stringify(DEF[k]))o[k]=c[k];return o};
const enc=c=>{let s="";new TextEncoder().encode(JSON.stringify(slim(c))).forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const dec=s=>{try{const b=atob(s.replace(/-/g,"+").replace(/_/g,"/"));return clean(JSON.parse(new TextDecoder().decode(Uint8Array.from(b,ch=>ch.charCodeAt(0)))))}catch{return null}};
const TLD=/^(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|org|net|io|dev|app|in|co|edu|gov|ai|me|tv|info|xyz|ly|gg|so|to|us|uk|de|fr|jp|ca|au|tech|site|online|store|blog|page|wiki|news)(?:[\/?#]\S*)?$/i;
function parseLinks(t){const ok=[];let bad=0;for(const l of t.split("\n")){if(!l.trim())continue;const [a,...b]=l.split("|");const u=safeUrl(b.join("|")||a);if(!u){bad++;continue}const h=new URL(u).hostname.replace(/^www\./,"");ok.push({n:((b.length&&a.trim())||h).slice(0,24),u})}return{ok:ok.slice(0,24),bad}}
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const mine=()=>{try{return JSON.parse(store.get("nook_mine")||"[]")}catch{return[]}};
const trust=k=>store.set("nook_mine",JSON.stringify(mine().concat(k).slice(-30)));

/* ========= Wallpaper storage (IndexedDB, stays in this browser) ========= */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("nook",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbPut=async(k,v)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("k","readwrite");t.objectStore("k").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const idbGet=async k=>{const d=await idb();return new Promise((res,rej)=>{const q=d.transaction("k").objectStore("k").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
let wpUrl=null;
const wpGet=async()=>{if(!wpUrl){const b=await idbGet("wp");if(b)wpUrl=URL.createObjectURL(b)}return wpUrl};
const wpReset=()=>{if(wpUrl)URL.revokeObjectURL(wpUrl);wpUrl=null};
async function shrink(file){const bmp=await createImageBitmap(file);const s=Math.min(1,2200/Math.max(bmp.width,bmp.height));
  const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
  cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);return new Promise(r=>cv.toBlob(r,"image/jpeg",.86))}

/* ========= Homepage renderer ========= */
let tick=null;
function applyStyle(c,root){
  const th=THEMES[c.t];
  root.className="hp "+c.cs+(c.wp.m!=="theme"||c.t==="sunset"?" sh":"");
  const st=root.style;
  st.setProperty("--bg",th.bg);st.setProperty("--fg",th.fg);st.setProperty("--card",th.card);st.setProperty("--solid",th.solid);
  st.setProperty("--ac",th.ac);st.setProperty("--acfg",th.acfg);st.setProperty("--font",FONTS[c.f][1]);
  st.setProperty("--r",c.r+"px");st.setProperty("--dim",c.dim/100);st.setProperty("--blur",c.blur+"px");
  st.setProperty("--al",c.al==="left"?"flex-start":"center");st.setProperty("--ta",c.al);
}
function render(c,root,opts={}){
  applyStyle(c,root);
  const links=parseLinks(c.links).ok;
  const eng=ENGINES[c.eng];
  let h="";
  if(c.w.clock)h+=`<div class="clock" data-clock></div><div class="date" data-date style="margin-top:-8px"></div>`;
  if(c.w.greeting)h+=`<div class="hello" data-hello></div>`;
  if(c.w.search)h+=`<form class="w sx" data-search><input type="search" placeholder="Search with ${esc(eng[0])}" aria-label="Search" autocomplete="off"><button>Search</button></form>`;
  if(c.w.links&&links.length)h+=`<nav class="tiles">${links.map(l=>`<a class="w tile" href="${esc(l.u)}" rel="noopener noreferrer" title="${esc(new URL(l.u).hostname)}"><i>${esc([...l.n][0]||"•").toUpperCase()}</i><span>${esc(l.n)}</span>${opts.hold?`<small>${esc(new URL(l.u).hostname.replace(/^www\./,""))}</small>`:""}</a>`).join("")}</nav>`;
  if(c.w.notes)h+=`<div class="w"><div class="lbl">Notes · saved on this device, not encrypted</div><textarea data-notes placeholder="Jot something down…" aria-label="Notes"></textarea></div>`;
  if(c.w.quote)h+=`<div class="w quote">“${esc(QUOTES[Math.floor(Date.now()/864e5)%QUOTES.length])}”</div>`;
  root.innerHTML=`<div class="wp"></div><div class="dim"></div><main>${h}</main>`+(opts.editLink?`<a class="edit" href="?edit#c=${enc(c)}">Edit this page</a>`:"");
  // wallpaper
  const wp=root.querySelector(".wp"),setBg=u=>{if(u)wp.style.backgroundImage=`url("${u.replace(/"/g,"%22")}")`};
  if(c.wp.m==="url"&&!opts.hold)setBg(c.wp.u);
  if(c.wp.m==="up"){if(wpUrl)setBg(wpUrl);else wpGet().then(u=>wp.isConnected&&setBg(u)).catch(()=>{})}
  // behaviour
  const q=s=>root.querySelector(s);
  const f=q("[data-search]");if(f)f.onsubmit=e=>{e.preventDefault();const v=f.querySelector("input").value.trim();if(!v)return;
    const u=safeUrl(/^https?:\/\/\S+$/i.test(v)||TLD.test(v)?v:"");location.href=u||eng[1]+encodeURIComponent(v)};
  const n=q("[data-notes]");if(n){n.value=store.get("nook_notes")||"";n.oninput=()=>store.set("nook_notes",n.value)}
  clearTimeout(tick);
  const upd=()=>{const d=new Date(),hr=d.getHours();
    const ck=q("[data-clock]");if(ck)ck.textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit",hour12:!c.h24}).replace(/\s?[ap]m$/i,m=>m.toLowerCase());
    const dt=q("[data-date]");if(dt)dt.textContent=d.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"});
    const hl=q("[data-hello]");if(hl)hl.textContent=(hr<5?"Still up":hr<12?"Good morning":hr<18?"Good afternoon":"Good evening")+(c.name?", "+c.name:"")};
  const loop=()=>{upd();tick=setTimeout(loop,60000-Date.now()%60000+30)};loop();
}

/* ========= Builder ========= */
function builder(initial){
  let S=clean(initial);
  const app=document.getElementById("app");
  app.innerHTML=`<div id="builder"><aside id="panel"></aside><section id="stage"><div id="frame"><div class="hp" id="pv"></div></div>
  <div id="out"><strong>Your homepage link</strong><input id="url" readonly aria-label="Homepage link">
  <ol><li>Tap <b>Copy link</b>.</li><li>In Brave: <b>Settings → Homepage</b> (turn it on, choose “Enter custom web address”).</li><li>Paste the link and you’re done.</li></ol>
  <div class="hint" id="upnote"></div></div>
  <div id="bar"><button class="btn main" id="gen">Create my link</button><button class="btn" id="reset">Reset</button></div></section></div>`;
  const P=document.getElementById("panel"),pv=document.getElementById("pv");
  const chips=(k,opts)=>`<div class="chips">${Object.entries(opts).map(([v,l])=>`<button class="chip" data-k="${k}" data-v="${v}" aria-pressed="false">${esc(Array.isArray(l)?l[0]:l)}</button>`).join("")}</div>`;
  const rng=(k,l,a,b)=>`<label class="row"><span>${l}<em class="val" data-o="${k}"></em></span><input type="range" data-r="${k}" min="${a}" max="${b}"></label>`;
  P.innerHTML=`<h1>Nook</h1><p class="sub">Design your browser homepage, preview it live, and get a link to paste into Web browser. No account, no hosting steps.</p>
  <div class="sec"><h2>Theme</h2><div class="chips">${Object.entries(THEMES).map(([k,t])=>`<button class="sw" data-k="t" data-v="${k}" aria-pressed="false" aria-label="${t.n}" title="${t.n}" style="background:${t.bg}"></button>`).join("")}</div></div>
  <div class="sec"><h2>Wallpaper</h2><div class="chips" id="wpm">${[["theme","Theme"],["url","Image link"],["up","Upload"]].map(([v,l])=>`<button class="chip" data-wp="${v}" aria-pressed="false">${l}</button>`).join("")}</div>
  <div id="wpx"></div>${rng("dim","Darken",0,70)}${rng("blur","Blur",0,20)}</div>
  <div class="sec"><h2>Font</h2>${chips("f",FONTS)}</div>
  <div class="sec"><h2>Widget style</h2>${chips("cs",CARDS)}${rng("r","Roundness",0,32)}</div>
  <div class="sec"><h2>Widgets</h2>${Object.entries(WIDGETS).map(([k,l])=>`<label class="row">${l}<input type="checkbox" data-w="${k}"></label>`).join("")}</div>
  <div class="sec"><h2>Your name</h2><input class="field" id="name" maxlength="30" placeholder="Shown in the greeting" autocomplete="off"></div>
  <div class="sec"><h2>Quick links</h2><textarea class="ta" id="links" spellcheck="false" aria-label="Quick links"></textarea><p class="hint" id="lh"></p></div>
  <div class="sec"><h2>Search engine</h2>${chips("eng",ENGINES)}</div>
  <div class="sec"><h2>Layout</h2>${chips("al",{center:"Centered",left:"Left"})}<label class="row" style="margin-top:12px">24-hour clock<input type="checkbox" id="h24"></label></div>`;
  const sync=()=>{
    P.querySelectorAll("[data-k]").forEach(b=>b.setAttribute("aria-pressed",String(S[b.dataset.k]===b.dataset.v)));
    P.querySelectorAll("[data-wp]").forEach(b=>b.setAttribute("aria-pressed",String(S.wp.m===b.dataset.wp)));
    P.querySelectorAll("[data-r]").forEach(i=>i.value=S[i.dataset.r]);
    P.querySelectorAll("[data-w]").forEach(i=>i.checked=!!S.w[i.dataset.w]);
    P.querySelector("#h24").checked=!!S.h24;
    P.querySelectorAll("[data-o]").forEach(e=>e.textContent=S[e.dataset.o]);
  };
  const wpx=P.querySelector("#wpx");
  const drawWp=msg=>{
    if(S.wp.m==="url")wpx.innerHTML=`<input class="field" id="wpu" placeholder="https://…/photo.jpg" value="${esc(S.wp.u)}" aria-label="Image link"><p class="hint">Links work on every device.</p>`;
    else if(S.wp.m==="up")wpx.innerHTML=`<input class="field" id="wpf" type="file" accept="image/*" aria-label="Upload wallpaper"><p class="hint ${msg?"err":""}">${msg||"Saved in this browser only, so open the homepage in the same browser. Large photos are resized automatically."}</p>`;
    else wpx.innerHTML="";
  };
  const hintLinks=()=>{const {ok,bad}=parseLinks(S.links),h=P.querySelector("#lh");h.className="hint"+(bad?" err":"");h.textContent=bad?`${bad} line${bad>1?"s":""} skipped: not a valid web address. Use Name | website.`:`${ok.length} link${ok.length===1?"":"s"}. One per line: Name | website (up to 24).`};
  let raf=0;
  const draw=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{render(S,pv);hintLinks()});store.set("nook_draft",JSON.stringify(S));document.getElementById("out").classList.remove("show")};
  const restyle=()=>{applyStyle(S,pv);store.set("nook_draft",JSON.stringify(S))};
  P.addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;
    if(b.dataset.k){S[b.dataset.k]=b.dataset.v}
    else if(b.dataset.wp){S.wp.m=b.dataset.wp;drawWp()}
    else return;
    sync();draw();
  });
  P.addEventListener("input",e=>{
    const t=e.target;
    if(t.dataset.r){S[t.dataset.r]=+t.value;const o=P.querySelector(`[data-o="${t.dataset.r}"]`);if(o)o.textContent=t.value;restyle();return}
    if(t.dataset.w)S.w[t.dataset.w]=t.checked?1:0;
    else if(t.id==="h24")S.h24=t.checked?1:0;
    else if(t.id==="name")S.name=t.value;
    else if(t.id==="links")S.links=t.value;
    else if(t.id==="wpu"){S.wp.u=safeUrl(t.value)}
    else return;
    draw();
  });
  P.addEventListener("change",async e=>{
    if(e.target.id!=="wpf")return;const f=e.target.files[0];if(!f)return;
    if(!f.type.startsWith("image/")||f.size>25e6){drawWp("Choose an image under 25 MB (JPG, PNG or WebP).");return}
    try{await idbPut("wp",await shrink(f));wpReset();S.wp.m="up";draw();drawWp("Wallpaper saved. Remember: it only shows in this browser.")}
    catch{drawWp("Couldn’t read that image. Try a JPG or PNG, or use an image link instead.")}
  });
  document.getElementById("gen").onclick=()=>{
    const base=location.href.split("#")[0].split("?")[0],k=enc(S),link=base+"#c="+k;trust(k);
    const o=document.getElementById("out"),u=document.getElementById("url");u.value=link;o.classList.add("show");
    document.getElementById("upnote").textContent=S.wp.m==="up"?"Your uploaded wallpaper lives in this browser. To use it in Brave on your phone, open Nook in Brave there and upload again, or use an image link.":"";
    let b=document.getElementById("cp");if(!b){b=document.createElement("button");b.id="cp";b.className="btn main";o.insertBefore(b,u.nextSibling)}
    b.textContent="Copy link";b.onclick=async()=>{try{await navigator.clipboard.writeText(link)}catch{u.select();document.execCommand("copy")}b.textContent="Copied";setTimeout(()=>b.textContent="Copy link",1800)};
    o.scrollIntoView({behavior:"smooth",block:"nearest"});
  };
  document.getElementById("reset").onclick=()=>{S=clean(DEF);P.querySelector("#name").value="";P.querySelector("#links").value=S.links;sync();drawWp();draw()};
  P.querySelector("#name").value=S.name;P.querySelector("#links").value=S.links;
  sync();drawWp();draw();
}

/* ========= Router ========= */
(function(){
  addEventListener("hashchange",()=>location.reload());
  const app=document.getElementById("app"),m=location.hash.match(/^#c=([\w-]+)/),edit=/[?&]edit\b/.test(location.search);
  if(m&&!edit){
    const c=dec(m[1]);
    if(c){document.title="Home";const r=document.createElement("div");r.style.height="100%";app.appendChild(r);const key=m[1];
      const show=hold=>{render(c,r,{editLink:true,hold});if(hold){const b=document.createElement("div");b.className="banner";b.innerHTML="<span>This page came from a link. Check where the shortcuts go before you click.</span><button>Looks good</button>";b.querySelector("button").onclick=()=>{trust(key);show(false)};r.appendChild(b)}};
      show(!mine().includes(key));return}
  }
  let start=m?dec(m[1]):null;
  if(!start){try{start=JSON.parse(store.get("nook_draft"))}catch{}}
  builder(start);
})();
</script>
